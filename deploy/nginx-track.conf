# Track (วิชาเสริม ม.4-6) — nginx reverse-proxy snippet.
#
# Add INSIDE the existing SchoolOS `server { }` block on the production server,
# alongside the other /location blocks (users, sportday, …). The app listens on
# host port 3004 (APP_PORT). Do NOT add a second server{} — reuse the one that
# already terminates TLS for the school domain.
#
# ── The one rule that matters ────────────────────────────────────────────────
# The app is BUILT to live at /tracks (NEXT_PUBLIC_BASE_PATH → Next.js
# `basePath`). It expects to receive the /tracks prefix and answers on it.
# So `proxy_pass` must have NO trailing slash / no URI part — that is what
# makes nginx forward the original path untouched.
#
#     proxy_pass http://127.0.0.1:3004;     ← correct (passes /tracks/… through)
#     proxy_pass http://127.0.0.1:3004/;    ← WRONG (strips /tracks; assets 404)
#
# A stripping proxy_pass cannot work here: the HTML would reference
# /_next/static/… at the site root, which this location block never matches.

location /tracks/ {
    proxy_pass         http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    # Backup upload / restore can be large — match the app's 200MB action limit.
    client_max_body_size 210m;
    proxy_read_timeout   300s;
}

# Bare /tracks → /tracks/. Next.js itself would redirect, but doing it here
# keeps the round trip on nginx.
location = /tracks {
    return 308 /tracks/;
}

# ── If the app runs as a container next to nginx on `school-net` ─────────────
# Drop the published host port from docker-compose.yml and proxy to the
# container name instead — same rule about the trailing slash applies:
#
#     proxy_pass http://tracks-app:3000;
#
# ── Alternative: dedicated subdomain ─────────────────────────────────────────
