# Track (วิชาเสริม ม.4-6) — nginx reverse-proxy snippet.
#
# Add INSIDE the existing SchoolOS `server { }` block on the production server,
# alongside the other /location blocks (users, sportday, …). The app listens on
# host port 3004 (APP_PORT). Do NOT add a second server{} — reuse the one that
# already terminates TLS for the school domain.
#
# The app is served under the /track path prefix. Next.js is configured to run
# at the root, so we strip the prefix on the way in. If you prefer a subdomain
# (track.school.ac.th) instead of a path, use the alternative block at the end.

location /track/ {
    proxy_pass         http://127.0.0.1:3004/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";

    # Backup upload / restore can be large — match the app's 200MB action limit.
    client_max_body_size 210m;
    proxy_read_timeout   300s;
}

# Redirect the bare /track to /track/ so relative asset URLs resolve.
location = /track {
    return 308 /track/;
}

